<!DOCTYPE html>
<html lang="ko">
<head>
<script>(function(){try{if(localStorage.getItem("beoltoon_auth")!=="ok"){location.replace("login.html");}}catch(e){location.replace("login.html");}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>얼그레이 / 캐모마일 티 ICE - 조리매뉴얼</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="header">
  <a href="index.html">&larr; 목록으로</a>
</div>

<div class="container">

  <img class="main-photo" src="images/recipe41-main.jpg" alt="얼그레이 / 캐모마일 티 ICE 완성 사진" />

  <div class="info-box">
    <table class="info-table">
      <tr><th>메뉴명</th><td>얼그레이 / 캐모마일 티 ICE</td></tr>
      <tr><th>판매가격</th><td>4,000원</td></tr>
      <tr><th>원재료</th><td>얼그레이티 또는 캐모마일티, 정수물, 얼음</td></tr>
      <tr><th>사용 부자재</th><td>16oz 아이스컵, 리드뚜껑, 홀더, 빨대</td></tr>
    </table>
  </div>

  <div class="steps-title">제조방법</div>

  <div class="step-card">
    <img class="step-photo" src="images/recipe41-step1.jpg" alt="1단계 사진" />
    <div class="step-text">
      <span class="step-number">1</span><br>
      계량컵에 뜨거운물 150g을 담는다.
    </div>
  </div>

  <div class="step-card">
    <img class="step-photo" src="images/recipe41-step2.jpg" alt="2단계 사진" />
    <div class="step-text">
      <span class="step-number">2</span><br>
      티백 1개를 꽂아 1분간 우려낸다.
    </div>
  </div>

  <div class="step-card">
    <img class="step-photo" src="images/recipe41-step3.jpg" alt="3단계 사진" />
    <div class="step-text">
      <span class="step-number">3</span><br>
      16온스 컵에 얼음을 가득담고, 티백을 걸쳐둔다.
    </div>
  </div>

  <div class="step-card">
    <img class="step-photo" src="images/recipe41-step4.jpg" alt="4단계 사진" />
    <div class="step-text">
      <span class="step-number">4</span><br>
      우려낸 티를 부어준다.
    </div>
  </div>

  <div class="step-card">
    <img class="step-photo" src="images/recipe41-step5.jpg" alt="5단계 사진" />
    <div class="step-text">
      <span class="step-number">5</span><br>
      평리드 뚜껑을 덮고 빨대와 함께 제공한다.<br>
      <small>(※일회용컵 사용 시, 홀더 끼워 제공)</small>
    </div>
  </div>

  <div class="footer-note">
    본 저작물을 무단으로 사용하는 것은 저작권자의 권리 침해의 불법 행위로 법적 분쟁을 야기할 수 있습니다.
  </div>

</div>

  <script src="videos.js"></script>
</body>
</html>
