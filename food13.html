<div class="header">
  <a href="food.html">&larr; 목록으로</a>

<div class="container">

  <img class="main-photo" src="images/food13-main.jpg" alt="카라멜 팝콘 완성 사진" />

  <div class="info-box">
    <table class="info-table">
      <tr><th>메뉴명</th><td>카라멜 팝콘</td></tr>
      <tr><th>판매가격</th><td>7,500원 / 세트 11,500원 (+콜라2잔)</td></tr>
      <tr><th>원재료</th><td>카라멜팝콘</td></tr>

  <div class="steps-title">조리방법</div>

  <div class="step-card">
    <img class="step-photo" src="images/food13-step1.jpg" alt="1단계 사진" />

      <span class="step-number">1</span><br>
      팝콘 용기에 카라멜 팝콘 200g을 담는다.
    </div>
  </div>

  <div class="step-card">
    <img class="step-photo" src="images/food13-step2.jpg" alt="2단계 사진" />
    <div class="step-text">
      <span class="step-number">2</span><br>
      단품으로 판매할 경우,<br>팝콘, 물티슈를 제공한다.
    </div>
  </div>

  <div class="step-card">
    <img class="step-photo" src="images/food13-step3.jpg" alt="3단계 사진" />
    <div class="step-text">
      <span class="step-number">3</span><br>
      세트로 판매할 경우,<br>물티슈와 얼음컵+콜라2잔을 함께 제공한다.
