<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>벌툰 조리매뉴얼 - 로그인</title>
<link rel="icon" type="image/png" href="icon-512.png" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
         background:#f4f5f7; color:#222; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:380px; background:#fff; border-radius:20px;
          box-shadow:0 12px 40px rgba(0,0,0,.12); padding:32px 26px 28px; }
  .logo { text-align:center; margin-bottom:6px; }
  .logo .title { font-size:22px; font-weight:800; color:#d97757; letter-spacing:-.5px; }
  .logo .sub { font-size:14px; color:#888; margin-top:6px; }
  .lock { text-align:center; font-size:34px; margin:10px 0 18px; }
  label { display:block; font-size:13px; font-weight:700; color:#555; margin:14px 0 6px; }
  input { width:100%; padding:14px; border:1.5px solid #e2e3e6; border-radius:12px;
          font-size:16px; outline:none; }
  input:focus { border-color:#d97757; }
  button { width:100%; margin-top:22px; padding:15px; border:none; border-radius:12px;
           background:#d97757; color:#fff; font-size:17px; font-weight:800; cursor:pointer; }
  button:hover { background:#c8663f; }
  .err { color:#e02b2b; font-size:14px; text-align:center; margin-top:14px; min-height:20px; font-weight:600; }
  .hint { margin-top:18px; font-size:12px; color:#9ca3af; line-height:1.6; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <div class="logo">
      <div class="title">벌툰 조리매뉴얼</div>
      <div class="sub">점주님 전용 · 로그인 후 열람 가능</div>
    </div>
    <form id="loginForm" autocomplete="off">
      <label for="store">매장명</label>
      <input type="text" id="store" placeholder="예) 부산서면본점" autocapitalize="off" />
      <label for="pw">사업자등록번호 (숫자만)</label>
      <input type="password" id="pw" placeholder="예) 5513501421" inputmode="numeric" />
      <button type="submit">열람하기</button>
      <div class="err" id="err"></div>
    </form>
    <div class="hint">매장명은 지역·브랜드 빼고 <b>매장 이름만</b> 입력하세요.<br>사업자번호는 <b>'-' 없이 숫자만</b> 입력하세요.</div>
  </div>

  <script src="auth-hashes.js"></script>
  <script>
  /* ===== 순수 JS SHA-256 (어느 브라우저/환경에서도 동작) ===== */
  function sha256hex(ascii){
    function rr(n,x){return (x>>>n)|(x<<(32-n));}
    var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    // UTF-8 encode
    var bytes=[]; for(var i=0;i<ascii.length;i++){var c=ascii.charCodeAt(i);
      if(c<0x80)bytes.push(c);
      else if(c<0x800){bytes.push(0xc0|(c>>6),0x80|(c&0x3f));}
      else if(c<0xd800||c>=0xe000){bytes.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));}
      else{i++;var c2=((c&0x3ff)<<10)|(ascii.charCodeAt(i)&0x3ff);c2+=0x10000;
        bytes.push(0xf0|(c2>>18),0x80|((c2>>12)&0x3f),0x80|((c2>>6)&0x3f),0x80|(c2&0x3f));}}
    var l=bytes.length; bytes.push(0x80);
    while(bytes.length%64!=56)bytes.push(0);
    var bl=l*8; for(var i=7;i>=0;i--){bytes.push((bl/Math.pow(2,i*8))&0xff);}
    var w=new Array(64);
    for(var j=0;j<bytes.length;j+=64){
      for(var i=0;i<16;i++)w[i]=(bytes[j+i*4]<<24)|(bytes[j+i*4+1]<<16)|(bytes[j+i*4+2]<<8)|(bytes[j+i*4+3]);
      for(var i=16;i<64;i++){var s0=rr(7,w[i-15])^rr(18,w[i-15])^(w[i-15]>>>3);
        var s1=rr(17,w[i-2])^rr(19,w[i-2])^(w[i-2]>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(var i=0;i<64;i++){var S1=rr(6,e)^rr(11,e)^rr(25,e);var ch=(e&f)^((~e)&g);
        var t1=(h+S1+ch+K[i]+w[i])|0;var S0=rr(2,a)^rr(13,a)^rr(22,a);
        var mj=(a&b)^(a&c)^(b&c);var t2=(S0+mj)|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;}
    var out=""; for(var i=0;i<8;i++)out+=("00000000"+(H[i]>>>0).toString(16)).slice(-8);
    return out;
  }

  var storeSet = {}; (window.BT_STORE_HASHES||[]).forEach(function(h){storeSet[h]=1;});
  var SALT = window.BT_SALT || "";

  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var name=(document.getElementById("store").value||"").replace(/\s+/g,"");
    var pwRaw=(document.getElementById("pw").value||"");
    var err=document.getElementById("err");
    if(!name||!pwRaw){ err.textContent="매장명과 사업자번호를 입력해주세요."; return; }

    var ok=false;
    if(name==="관리자"||name.toLowerCase()==="admin"){
      ok = sha256hex(SALT+"|__ADMIN__|"+pwRaw)===window.BT_ADMIN_HASH;
    } else {
      var digits=pwRaw.replace(/\D/g,"");
      ok = !!storeSet[ sha256hex(SALT+"|"+name+"|"+digits) ];
    }
    if(ok){
      try{ localStorage.setItem("beoltoon_auth","ok"); }catch(_){}
      location.replace("index.html");
    } else {
      err.textContent="매장명 또는 사업자번호가 일치하지 않아요.";
    }
  });
  </script>
</body>
</html>
